# Shared defaults for every experiment. Experiment files override the pieces
# they care about; the `tiers` block below then applies smoke/dev/full overrides
# on top. Switching tier is a flag (`--tier`), never a code edit.

seed: 42
seeds: [0, 1, 2]          # multi-seed set used at the `full` tier

model:
  name: small_cnn         # overridden per tier (resnet18 for dev/full)
  num_classes: 8
  pretrained: false
  norm: batch             # 'group' for the DP-comparable baseline

data:
  # root: null            # left unset -> chosen by tier (fixture for smoke, real for dev/full)
  image_size: 200
  batch_size: 32
  num_workers: 0

optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001

# Loss: inverse-frequency class weighting counters the severe imbalance (nevus
# dominates). Without it, cross-entropy collapses to the majority class
# (balanced accuracy = 1/8). Mirrors FLamby's weighted-loss baseline.
loss:
  class_weights: balanced   # one of: balanced | none

# Centralized / local-only baselines
training:
  epochs: 20
  max_batches: null       # cap batches/epoch (used to shrink dev/smoke)

# Federated defaults
federated:
  rounds: 50
  local_epochs: 1
  max_batches: null

# ---------------------------------------------------------------------------
# Tier overrides (later wins). smoke = fixture + tiny; dev = real subset on CPU/GPU;
# full = real data, full schedule, GPU (launched by Mahmoud).
# GroupNorm is used for dev/full: BatchNorm running-stat averaging is ill-defined
# across non-IID silos and destabilizes FedAvg; GN keeps FL/baselines/DP on ONE
# architecture (brief section 4.1). Conv weights stay ImageNet-pretrained.
# dev volumes (60 batches x 15 rounds/epochs) are empirically enough for the
# GroupNorm-pretrained model to escape majority collapse and show real trends.
# ---------------------------------------------------------------------------
tiers:
  smoke:
    model: { name: small_cnn, pretrained: false, norm: group }
    data: { image_size: 32, batch_size: 8, num_workers: 0 }
    training: { epochs: 1, max_batches: 2 }
    federated: { rounds: 2, local_epochs: 1, max_batches: 2 }

  dev:
    model: { name: resnet18, pretrained: true, norm: group }
    data: { image_size: 64, batch_size: 16, num_workers: 2 }
    training: { epochs: 15, max_batches: 60 }
    federated: { rounds: 15, local_epochs: 1, max_batches: 60 }

  full:
    model: { name: resnet18, pretrained: true, norm: group }
    data: { image_size: 200, batch_size: 32, num_workers: 4 }
    training: { epochs: 40, max_batches: null }
    federated: { rounds: 50, local_epochs: 1, max_batches: null }
