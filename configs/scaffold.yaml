# SCAFFOLD (Karimireddy et al., 2020): control variates correct client drift.
experiment: scaffold
task: federated
strategy:
  name: scaffold
  server_lr: 1.0
# Uses the shared Adam optimizer (inherited from _base) so FedAvg/FedProx/SCAFFOLD
# are directly comparable. Caveat: SCAFFOLD's control-variate scaling 1/(K*lr)
# nominally assumes SGD local steps; with Adam we use the nominal lr there (a
# common practical choice). SGD-SCAFFOLD is a possible refinement for the report.
