# SCAFFOLD (Karimireddy et al., 2020): control variates correct client drift.
experiment: scaffold
task: federated
strategy:
  name: scaffold
  server_lr: 1.0
# Plain SGD (momentum 0) is REQUIRED: the control-variate update
# c_i^+ = c_i - c + (x - y)/(K*eta_l) assumes y - x = -eta_l * sum(g - c_i + c).
# With momentum the correction accumulates in the velocity and the control
# variates diverge (observed loss -> nan). Momentum 0 makes c_i^+ collapse to the
# client's mean gradient (bounded, stable). FedAvg/FedProx use Adam; a matched
# all-plain-SGD comparison is a report refinement.
optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0001
