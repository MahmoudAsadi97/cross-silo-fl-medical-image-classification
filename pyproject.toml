[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_med"
version = "0.1.0"
description = "Cross-silo federated learning for medical image classification (Fed-ISIC2019)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mahmoud Asadi Heris" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=9.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

# Heavy / environment-specific extras are intentionally optional so the pure-python
# core (config, seeding, metrics, aggregation math) can be imported and unit-tested
# without a GPU stack. Install with:  pip install -e ".[torch]"
[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15", "tqdm>=4.65"]
privacy = ["opacus>=1.4", "dp-accounting>=0.4"]
dashboard = ["streamlit>=1.30"]
demo = [
    "numpy>=1.24,<2",
    "torch>=2.5,<2.6",
    "torchvision>=0.20,<0.21",
    "opacus==1.5.4",
    "flwr==1.11.1",
]
edge = ["onnx>=1.14", "onnxruntime>=1.16"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fl_med*"]

[tool.setuptools.package-data]
fl_med = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["archive", "notebooks", "data", "experiments", "results"]

# Pin the lint surface explicitly (the classic ruff default set). Newer ruff
# releases keep expanding their defaults (isort, pyupgrade, pylint, ...), which
# breaks CI on style-modernization rules this codebase never adopted; an explicit
# select keeps the lint gate deterministic across ruff versions.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "torch: tests that require the optional torch stack",
    "slow: long-running tests",
]
