name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Torch-free job: proves the correctness-critical math on every push, fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Torch-free correctness checks
        run: python scripts/verify_core_math.py
      - name: Pytest (torch tests auto-skip)
        run: python -m pytest -q

  smoke-torch:
    # Full smoke incl. the torch end-to-end path (CPU wheels).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with torch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Generate fixture
        run: python scripts/generate_fixture.py
      - name: Smoke train (FedAvg on fixture)
        run: python scripts/run_experiment.py --config configs/fedavg.yaml --tier smoke
      - name: Pytest incl. torch
        run: python -m pytest -q
